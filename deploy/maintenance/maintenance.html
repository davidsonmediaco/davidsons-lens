<style>
  :root{ --bg:#0D0D0D; --text:#F5F5F5; --muted:#A0A0A0; --gold:#C9A84C; --gold-hi:#DFC070; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:48px 24px; text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:620px}
  .wordmark{
    font-family:'Playfair Display',Georgia,serif;
    font-size:clamp(1.5rem,5vw,2.25rem); letter-spacing:.3em;
    text-transform:uppercase; margin-bottom:2.5rem; line-height:1.3;
  }
  h1{
    font-family:'Playfair Display',Georgia,serif; font-weight:400;
    font-size:clamp(2rem,7vw,3.25rem); line-height:1.15; margin-bottom:1.75rem;
  }
  .rule{width:48px;height:1px;background:var(--gold);margin:0 auto 1.75rem}
  p{font-size:1.0625rem;line-height:1.75;margin-bottom:1.25rem}
  p.sub{color:var(--muted);font-size:.9375rem}
  a{color:var(--gold);text-decoration:none;transition:color .3s}
  a:hover{color:var(--gold-hi)}
  .socials{display:flex;gap:1.75rem;justify-content:center;margin-top:2.5rem}
  .socials a{display:inline-flex;color:var(--text)}
  .socials a:hover{color:var(--gold)}
  .socials svg{width:22px;height:22px;fill:currentColor}
  .mail{display:inline-block;margin-top:2rem;font-size:.8125rem;letter-spacing:.2em;text-transform:uppercase}
</style>
