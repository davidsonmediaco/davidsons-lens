<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>We'll Be Right Back | Davidsons Lens</title>
<meta name="robots" content="noindex">
<meta name="description" content="Davidsons Lens is getting a quick facelift. Back shortly.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0D0D; --text:#F5F5F5; --muted:#C8C8C8;
    --gold:#C9A84C; --gold-hi:#DFC070;
    --display:'Playfair Display',Georgia,'Times New Roman',serif;
    --body:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text); font-family:var(--body);
    min-height:100svh; display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }

  /* Full-bleed background photo */
  .bg{position:fixed;inset:0;z-index:0}
  .bg img{width:100%;height:100%;object-fit:cover;object-position:center 35%;display:block}
  /* Black "softbox" scrim over the photo @ 15% */
  .scrim{position:fixed;inset:0;z-index:1;background:#000;opacity:.15}

  /* Content sits on the scrim */
  .wrap{
    position:relative; z-index:2; width:100%; max-width:640px;
    padding:56px 28px; text-align:center;
    text-shadow:0 2px 18px rgba(0,0,0,.65), 0 1px 3px rgba(0,0,0,.5);
  }

  .wordmark{
    font-family:var(--display); font-size:clamp(.95rem,2.6vw,1.2rem);
    letter-spacing:.38em; text-transform:uppercase; font-weight:500;
    margin:0 0 2.75rem; line-height:1.6;
  }

  h1{
    font-family:var(--display); font-weight:400;
    font-size:clamp(2.05rem,6.4vw,3.4rem);
    line-height:1.22; letter-spacing:.005em; margin:0 0 1.9rem;
  }

  .rule{width:56px;height:1px;background:var(--gold);margin:0 auto 1.9rem;opacity:.95}

  p{font-size:clamp(1rem,2.6vw,1.1rem);line-height:1.85;margin:0 auto 1.15rem;max-width:30rem;font-weight:300}
  p.sub{color:var(--muted);font-size:clamp(.9rem,2.3vw,.975rem);line-height:1.8;margin-bottom:0}

  /* Social / contact buttons */
  .links{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:2.9rem}
  .links a{
    display:inline-flex;align-items:center;justify-content:center;
    width:52px;height:52px;
    border:1px solid rgba(201,168,76,.65); color:var(--text);
    transition:background-color .3s,color .3s,border-color .3s,transform .3s;
    text-decoration:none;
  }
  .links a:hover,.links a:focus-visible{
    background:var(--gold); border-color:var(--gold); color:#0D0D0D; transform:translateY(-2px);
  }
  .links svg{width:21px;height:21px;fill:currentColor;display:block}
  .links a:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

  .email{
    display:inline-block;margin-top:1.9rem;color:var(--gold);
    font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;
    text-decoration:none;transition:color .3s;
  }
  .email:hover{color:var(--gold-hi)}

  @media (max-width:420px){
    .wrap{padding:44px 22px}
    .links a{width:48px;height:48px}
  }
</style>
</head>
<body>
  <div class="bg">
    <img src="/maintenance-assets/gail.jpg" alt="" aria-hidden="true" fetchpriority="high">
  </div>
  <div class="scrim" aria-hidden="true"></div>

  <main class="wrap">
    <p class="wordmark">Davidsons Lens</p>
    <h1>We&rsquo;re getting a<br>little facelift.</h1>
    <div class="rule"></div>
    <p>Nothing&rsquo;s changing about the work &mdash; I&rsquo;m just making it easier to book your next shoot.</p>
    <p class="sub">Back up and running shortly. Reach out anytime in the meantime.</p>
